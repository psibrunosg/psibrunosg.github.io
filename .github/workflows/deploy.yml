name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Evita deploys concorrentes no Pages — causa comum de "Deployment failed, try again later"
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Portoes de qualidade. Antes destes steps o unico portao era o `tsc -b`
      # dentro do build, entao lint e testes nunca barravam deploy.
      #
      # Lint roda como AVISO, nao como portao: existem 63 erros pre-existentes
      # (19 no-explicit-any, 15 set-state-in-effect, 8 refs, ...). Torna-lo
      # bloqueante agora derrubaria o deploy no proximo push sem corrigir nada.
      # Zerada essa divida, troque para bloqueante removendo o continue-on-error.
      - name: Lint (aviso)
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test

      # Valida que os caminhos .obj referenciados por neuroanatomia.ts existem em
      # disco e que o cortex nao estourou o teto de peso. Um arquivo renomeado
      # quebra o laboratorio 3D em producao sem nenhum outro sinal.
      - name: Check neuro models
        run: npm run check:neuro-models

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
